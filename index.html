<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darian Daudigny – Hjemmesider</title>
<style>
  :root { --bg:#f6f3ee; --ink:#1d1b18; --muted:#6b655c; --accent:#c2552d; }
  * { box-sizing:border-box; margin:0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; }
  main { max-width:640px; margin:0 auto; padding:72px 20px; }
  h1 { font-size:clamp(2rem, 6vw, 3rem); line-height:1.1; margin-bottom:16px; }
  h1 span { color:var(--accent); }
  p { color:var(--muted); font-size:1.1rem; margin-bottom:24px; }
  .ok { display:inline-block; background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>Hjemmesider til <span>lokale virksomheder</span></h1>
  <p>Dette er en testside. Hvis du kan se den, virker opsætningen, og den næste side kan være til en rigtig kunde.</p>
  <span class="ok">✓ Siden er online</span>
</main>
</body>
</html>
